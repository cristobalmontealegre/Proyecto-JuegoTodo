<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contacto - Juegotodo</title>
    <link rel="stylesheet" href="estilo/stylecontacto.css">
</head>
<body>
    <header>
        <div class="logo">
            <h1>Juegotodo</h1>
        </div>
        <nav class="navegacion">
            <a href="index.html">INICIO</a> /
            <a href="informacion.html">INFORMACION</a> /
            <a href="contacto.html">CONTACTO</a>
        </nav>
        <div class="usuario">
            <a href="../iniciarsesion.html" class="btn-sesion">INICIAR SESION</a>
        </div>
    </header>

    <div class="titulo-seccion">CONTACTO</div>

    <!-- Contenedor único y directo -->
    <div class="contacto-caja">
        <h2>¿Tienes alguna duda o sugerencia?</h2>
        <p>Escríbenos y te responderemos lo más rápido posible para ayudarte a encontrar el mejor precio.</p>

        <form>
            <input type="text" placeholder="Tu Nombre" required>
            <input type="email" placeholder="Tu Correo Electrónico" required>
            <textarea placeholder="Tu Mensaje" rows="8" ></textarea>
            <button type="submit">ENVIAR MENSAJE</button>
        </form>
    </div>
</body>
</html>
