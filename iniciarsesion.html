<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>INICIO DE SESION</title>
    <link rel="stylesheet" href="estilo/styleiniciarsesion.css">
</head>
<body>
    <div style="margin-bottom: 30px;">
        <a href="index.html" class="btn-volver">← Volver</a>
    </div>
    <h1 class="titulo-basico">INICIO DE SESION</h1>
    <form class="caja-login" onsubmit="iniciarSesion(event)">
        <input type="text" id="login-usuario" placeholder="Nombre de usuario o Correo" class="input-basico" required>
        <input type="password" id="login-password" placeholder="Contraseña" class="input-basico" required>
        <button type="submit" class="btn-ingresar">ENTRAR</button>
    </form>

    <script src="script/login.js"></script>
</body>
</html>
